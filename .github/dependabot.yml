version: 2
updates:
  # GitHub Actions: keeps SHA pins and their version comments current
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  # Docker: the node base image in the Dockerfile
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on a Node LTS line. Majors include non-LTS releases (e.g. 25),
      # so they're moved by hand to the next LTS (24, 26, ...).
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
